<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bücherwelt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <header class="hero">
      <div class="hero-topbar">
        <form class="inline-form" action="login.sh" method="get">
          <input type="text" name="n" placeholder="Benutzername" required>
          <input type="password" name="p" placeholder="Passwort" required>
          <button type="submit">Login</button>
        </form>
      </div>

      <div class="hero-content">
        <p class="eyebrow">Buecherwelt Team12</p>
        <h1>Willkommen bei der Buecherwelt</h1>
        <p>Suche in unserem aktuellen Buchbestand und verwalte Titel nach dem Login.</p>
        <form class="search-form" action="Bücherwelt.sh" method="get">
          <input type="text" name="s" placeholder="Titel, Autor oder Genre suchen ...">
          <button type="submit">Suche starten</button>
        </form>
      </div>
    </header>

    <main class="content-shell">
      <section class="info-card">
        <h2>Was ist neu?</h2>
        <p>Die neue Version nutzt ein aufgeraeumtes Design und robustere CGI-Skripte fuer Login, Suche, Hinzufuegen und Entfernen von Buechern.</p>
      </section>
    </main>

    <footer class="footer">
      <a href="impressum.html">Ueber uns</a>
    </footer>
  </body>
</html>
